<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Warga Desa Segeran Kidul</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

<style>
:root {
    --primary: #0ea5e9;
    --primary-dark: #0284c7;
    --success: #10b981;
    --danger: #ef4444;
    --dark: #0f172a;
    --gray: #64748b;
    --light: #f8fafc;
    --border: #e2e8f0;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,.08);
    --shadow-lg: 0 10px 40px rgba(0,0,0,.12);
    --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html {
    height: 100%; overflow: hidden;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    color: var(--dark);
}

#map-canvas { position: absolute; inset: 0; }

/* ===== LOADING ===== */
#loader {
    position: fixed; inset: 0; z-index: 9999;
    background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; transition: opacity .5s ease, visibility .5s ease;
}
#loader.hide { opacity: 0; visibility: hidden; }
.spinner {
    width: 60px; height: 60px; border: 5px solid rgba(255,255,255,.25);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 1s linear infinite; margin-bottom: 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loader h2 { font-weight: 700; font-size: 20px; margin-bottom: 6px; }
#loader p { opacity: .8; font-size: 13px; }

/* ===== HEADER ===== */
.topbar {
    position: absolute; top: 16px; left: 16px; right: 16px; z-index: 100;
    display: flex; align-items: center; gap: 12px; justify-content: space-between;
    pointer-events: none;
}
.brand {
    background: rgba(255,255,255,.95); backdrop-filter: blur(20px);
    padding: 12px 20px; border-radius: var(--radius);
    box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 14px;
    pointer-events: auto;
}
.brand-logo {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px;
}
.brand-text h1 {
    font-size: 15px; font-weight: 800; line-height: 1.2;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.brand-text p { font-size: 11px; color: var(--gray); font-weight: 500; }

.topbar-actions {
    display: flex; gap: 10px; pointer-events: auto;
}

.btn-modern {
    background: rgba(255,255,255,.95); backdrop-filter: blur(20px);
    border: none; padding: 12px 18px; border-radius: var(--radius);
    box-shadow: var(--shadow-md); font-family: inherit;
    font-weight: 700; font-size: 13px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all .2s ease; color: var(--dark);
}
.btn-modern:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; }
.btn-success { background: linear-gradient(135deg, var(--success), #059669); color: #fff; }
.btn-danger  { background: linear-gradient(135deg, var(--danger), #dc2626); color: #fff; }

/* ===== SIDEBAR DAFTAR WARGA ===== */
.sidebar {
    position: absolute; top: 90px; left: 16px; bottom: 16px; z-index: 90;
    width: 340px; background: rgba(255,255,255,.97); backdrop-filter: blur(20px);
    border-radius: var(--radius); box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; overflow: hidden;
    transition: transform .3s ease;
}
.sidebar.collapsed { transform: translateX(-360px); }
.sidebar-header {
    padding: 18px 20px; border-bottom: 1px solid var(--border);
}
.sidebar-header h3 {
    font-size: 14px; font-weight: 800; margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
}
.sidebar-header h3 .badge-count {
    background: var(--primary); color: #fff; font-size: 11px;
    padding: 2px 10px; border-radius: 20px;
}
.sidebar-header p { font-size: 11px; color: var(--gray); }

.search-box {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
}
.search-wrap {
    position: relative;
}
.search-wrap i {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--gray); font-size: 13px;
}
.search-wrap input {
    width: 100%; padding: 10px 14px 10px 38px;
    border: 1px solid var(--border); border-radius: 10px;
    font-family: inherit; font-size: 13px; outline: none;
    transition: all .2s ease;
}
.search-wrap input:focus {
    border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14,165,233,.1);
}

.filter-row {
    padding: 10px 20px; border-bottom: 1px solid var(--border);
    display: flex; gap: 6px; overflow-x: auto;
}
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip {
    padding: 6px 14px; border-radius: 20px; font-size: 11px;
    font-weight: 700; background: var(--light); color: var(--gray);
    border: 1px solid var(--border); cursor: pointer; white-space: nowrap;
    transition: all .2s ease;
}
.filter-chip:hover { border-color: var(--primary); color: var(--primary); }
.filter-chip.active {
    background: var(--primary); color: #fff; border-color: var(--primary);
}

.warga-list {
    flex: 1; overflow-y: auto; padding: 8px;
}
.warga-list::-webkit-scrollbar { width: 6px; }
.warga-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.warga-item {
    padding: 12px; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    transition: all .15s ease; margin-bottom: 4px;
}
.warga-item:hover { background: var(--light); transform: translateX(2px); }
.warga-item.active {
    background: linear-gradient(135deg, rgba(14,165,233,.1), rgba(2,132,199,.05));
    border-left: 3px solid var(--primary);
}

.warga-avatar {
    width: 44px; height: 44px; border-radius: 12px; object-fit: cover;
    background: var(--light); flex-shrink: 0;
    border: 2px solid var(--border);
}
.warga-info { flex: 1; min-width: 0; }
.warga-info .nama {
    font-weight: 700; font-size: 13px; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.warga-info .meta {
    font-size: 11px; color: var(--gray);
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.warga-info .meta span {
    background: var(--light); padding: 1px 6px; border-radius: 4px;
    font-weight: 600;
}

.empty-state {
    padding: 40px 20px; text-align: center; color: var(--gray);
}
.empty-state i { font-size: 40px; opacity: .3; margin-bottom: 12px; display: block; }
.empty-state p { font-size: 13px; }

/* ===== FLOATING BUTTONS ===== */
.float-btn {
    position: absolute; z-index: 80;
    width: 48px; height: 48px; border-radius: 14px;
    background: rgba(255,255,255,.97); backdrop-filter: blur(20px);
    box-shadow: var(--shadow-md); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--dark); transition: all .2s ease;
}
.float-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.float-btn.toggle-sidebar { top: 16px; left: 16px; display: none; }

.instruction {
    position: absolute; bottom: 16px; right: 16px; z-index: 80;
    background: rgba(15,23,42,.9); color: #fff; padding: 10px 16px;
    border-radius: 30px; font-size: 11px; font-weight: 600;
    backdrop-filter: blur(20px); pointer-events: none;
    display: flex; align-items: center; gap: 8px;
}

/* ===== POPUP MODERN ===== */
.maplibregl-popup-content {
    padding: 0 !important; border-radius: var(--radius) !important;
    overflow: hidden; box-shadow: var(--shadow-lg) !important;
    font-family: 'Plus Jakarta Sans', sans-serif !important;
    width: 260px;
}
.maplibregl-popup-close-button {
    font-size: 22px !important; padding: 4px 10px !important;
    color: #fff !important; background: rgba(0,0,0,.3) !important;
    border-radius: 50% !important; width: 28px !important; height: 28px !important;
    top: 8px !important; right: 8px !important; line-height: 1 !important;
}

.popup-card { }
.popup-photo-wrap {
    position: relative; width: 100%; height: 180px;
    background: linear-gradient(135deg, #e0f2fe, #bae6fd);
}
.popup-photo-wrap img {
    width: 100%; height: 100%; object-fit: cover; display: block;
}
.popup-photo-wrap::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.5), transparent 50%);
}
.popup-body { padding: 16px; }
.popup-name {
    font-weight: 800; font-size: 15px; color: var(--dark);
    margin-bottom: 4px;
}
.popup-location {
    font-size: 12px; color: var(--primary); font-weight: 700;
    margin-bottom: 12px; display: flex; align-items: center; gap: 5px;
}
.popup-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 12px;
}
.popup-detail {
    background: var(--light); padding: 8px 10px; border-radius: 8px;
}
.popup-detail .label {
    font-size: 9px; color: var(--gray); text-transform: uppercase;
    letter-spacing: .5px; font-weight: 700; margin-bottom: 2px;
}
.popup-detail .value {
    font-size: 12px; color: var(--dark); font-weight: 700;
}
.popup-actions {
    display: flex; gap: 6px;
}
.popup-actions a {
    flex: 1; text-align: center; padding: 8px;
    border-radius: 8px; font-size: 11px; font-weight: 700;
    text-decoration: none; transition: all .2s ease;
}
.popup-actions a.wa {
    background: #25d366; color: #fff;
}
.popup-actions a.nav {
    background: var(--primary); color: #fff;
}
.popup-actions a:hover { opacity: .85; }

/* ===== MOBILE ===== */
@media (max-width: 768px) {
    .brand-text p { display: none; }
    .brand-text h1 { font-size: 13px; }
    .brand { padding: 10px 14px; }
    .brand-logo { width: 36px; height: 36px; font-size: 16px; }
    .topbar-actions .btn-modern span { display: none; }
    .btn-modern { padding: 12px 14px; }
    .sidebar {
        top: auto; bottom: 0; left: 0; right: 0; width: 100%;
        height: 45vh; border-radius: var(--radius) var(--radius) 0 0;
        max-height: 45vh;
    }
    .sidebar.collapsed { transform: translateY(calc(45vh - 0px)); }
    .float-btn.toggle-sidebar { display: flex; top: auto; bottom: 16px; left: 16px; }
    .instruction { display: none; }
    .maplibregl-popup-content { width: 220px; }
    .popup-photo-wrap { height: 140px; }
}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
    <div class="spinner"></div>
    <h2>Memuat Data Warga</h2>
    <p>Mengambil data dari database...</p>
</div>

<!-- MAP -->
<div id="map-canvas"></div>

<!-- HEADER -->
<div class="topbar">
    <div class="brand">
        <div class="brand-logo"><i class="fa-solid fa-map-location-dot"></i></div>
        <div class="brand-text">
            <h1>Peta Rumah Warga</h1>
            <p>Desa Segeran Kidul</p>
        </div>
    </div>
    <div class="topbar-actions">
        <button class="btn-modern btn-danger" onclick="laporSalahData()">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>Salah Data</span>
        </button>
        <a class="btn-modern btn-primary" href="daftar.html" target="_blank">
            <i class="fa-solid fa-user-plus"></i>
            <span>Daftar Baru</span>
        </a>
    </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h3><i class="fa-solid fa-users" style="color:var(--primary);"></i>
            Daftar Warga <span class="badge-count" id="total-count">0</span>
        </h3>
        <p>Klik nama untuk melihat lokasi</p>
    </div>
    <div class="search-box">
        <div class="search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Cari nama, blok, atau RT...">
        </div>
    </div>
    <div class="filter-row" id="filter-row">
        <button class="filter-chip active" data-filter="all">Semua</button>
    </div>
    <div class="warga-list" id="warga-list">
        <div class="empty-state">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <p>Memuat data...</p>
        </div>
    </div>
</div>

<!-- FLOAT BUTTON TOGGLE (mobile) -->
<button class="float-btn toggle-sidebar" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">
    <i class="fa-solid fa-list"></i>
</button>

<!-- INSTRUKSI -->
<div class="instruction">
    <i class="fa-solid fa-compass"></i>
    <span>Klik kanan + geser untuk rotasi 3D</span>
</div>

<script>
/* ================================================================
   KONFIGURASI — GANTI URL DI BAWAH INI
   ================================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbxLACfkiDvxp5ljiHK-cHIzJw7glGAKqP3w2oXF33CvKBJMjmId2bH35rmz8Eti1s3nXA/exec?action=read";
const ADMIN_WA = "628179402420";

/* ================================================================
   STATE
   ================================================================ */
let allWarga = [];
let markers = {};
let activeMarkerId = null;
let currentFilter = 'all';
let currentSearch = '';

/* ================================================================
   MAP INIT
   ================================================================ */
const map = new maplibregl.Map({
    container: 'map-canvas',
    style: {
        version: 8,
        sources: {
            'satellite': {
                type: 'raster',
                tiles: ['https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'],
                tileSize: 256,
                attribution: '© Google'
            }
        },
        layers: [{
            id: 'satellite-layer',
            type: 'raster',
            source: 'satellite',
            minzoom: 0,
            maxzoom: 24
        }]
    },
    center: [108.3958, -6.4682],
    zoom: 16,
    maxZoom: 23,
    pitch: 55,
    bearing: -10,
    antialias: true
});

map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: true }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

/* ================================================================
   LOAD DATA
   ================================================================ */
map.on('load', () => {
    loadData();
});

function loadData() {
    console.log('[PETA] Fetching:', API_URL);

    fetch(API_URL)
        .then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
        })
        .then(text => {
            console.log('[PETA] Response length:', text.length);
            let data;
            try {
                data = JSON.parse(text);
            } catch (e) {
                console.error('[PETA] Response bukan JSON:', text.substring(0, 300));
                throw new Error('Response bukan JSON. Cek deploy Apps Script.');
            }

            if (!Array.isArray(data)) {
                console.error('[PETA] Response bukan array:', data);
                throw new Error('Format data tidak valid: ' + (data.message || JSON.stringify(data).substring(0, 100)));
            }

            if (data.length === 0) {
                showEmpty('Belum ada data warga di spreadsheet');
                hideLoader();
                return;
            }

            console.log('[PETA] Loaded', data.length, 'records');
            processData(data);
        })
        .catch(err => {
            console.error('[PETA] Error:', err);
            showEmpty('Gagal memuat data: ' + err.message);
            hideLoader();
        });
}

/* ================================================================
   PROSES DATA
   ================================================================ */
function processData(data) {
    allWarga = data.filter(w => {
        const lat = parseFloat(w.latitude);
        const lng = parseFloat(w.longitude);
        return !isNaN(lat) && !isNaN(lng)
            && lat >= -11 && lat <= 6
            && lng >= 95  && lng <= 141;
    });

    if (allWarga.length === 0) {
        showEmpty('Data ada tapi koordinat tidak valid semua. Periksa kolom latitude/longitude.');
        hideLoader();
        return;
    }

    console.log('[PETA] Valid records:', allWarga.length);

    const bounds = new maplibregl.LngLatBounds();

    allWarga.forEach((w, i) => {
        const lat = parseFloat(w.latitude);
        const lng = parseFloat(w.longitude);
        const id = 'w_' + i;

        const marker = new maplibregl.Marker({
            color: '#0ea5e9',
            scale: 0.9
        })
        .setLngLat([lng, lat])
        .addTo(map);

        const popup = new maplibregl.Popup({
            offset: 20,
            closeButton: true,
            maxWidth: '280px'
        }).setHTML(buildPopupHTML(w, lat, lng));

        marker.setPopup(popup);

        marker.getElement().addEventListener('click', () => {
            setActiveItem(id);
        });

        markers[id] = { marker, popup, warga: w, id };
        bounds.extend([lng, lat]);
    });

    map.fitBounds(bounds, { padding: { top: 100, bottom: 60, left: 380, right: 60 }, maxZoom: 18 });

    renderList();
    buildFilters();
    document.getElementById('total-count').textContent = allWarga.length;
    hideLoader();
}

/* ================================================================
   POPUP HTML
   ================================================================ */
function buildPopupHTML(w, lat, lng) {
    const photo = getPhotoUrl(w.photo);
    const nama = w.nama_lengkap || 'Tanpa Nama';
    const waLink = w.no_hp ? `https://wa.me/62${w.no_hp.replace(/^0/, '').replace(/\D/g, '')}` : '#';
    const navLink = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;

    return `
        <div class="popup-card">
            <div class="popup-photo-wrap">
                <img src="${photo}" onerror="this.src='https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/img/avatar5.png'">
            </div>
            <div class="popup-body">
                <div class="popup-name">${escapeHtml(nama)}</div>
                <div class="popup-location">
                    <i class="fa-solid fa-location-dot"></i>
                    Blok ${escapeHtml(w.blok || '-')}, RT ${escapeHtml(w.rt || '-')}/RW ${escapeHtml(w.rw || '-')}
                </div>
                <div class="popup-grid">
                    <div class="popup-detail">
                        <div class="label">NO RUMAH</div>
                        <div class="value">${escapeHtml(w.tps || '-')}</div>
                    </div>
                    <div class="popup-detail">
                        <div class="label">No HP</div>
                        <div class="value">${escapeHtml(w.no_hp || '-')}</div>
                    </div>
                </div>
                <div class="popup-actions">
                    <a class="wa" href="${waLink}" target="_blank">
                        <i class="fa-brands fa-whatsapp"></i> WhatsApp
                    </a>
                    <a class="nav" href="${navLink}" target="_blank">
                        <i class="fa-solid fa-route"></i> Rute
                    </a>
                </div>
            </div>
        </div>
    `;
}

function getPhotoUrl(url) {
    if (!url) return 'https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/img/avatar5.png';
    if (url.indexOf('drive.google.com') !== -1) {
        let id = '';
        if (url.indexOf('id=') !== -1) id = url.split('id=')[1].split('&')[0];
        else if (url.indexOf('/d/') !== -1) id = url.split('/d/')[1].split('/')[0];
        if (id) return 'https://lh3.googleusercontent.com/d/' + id;
    }
    if (url.startsWith('http')) return url;
    return 'https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/img/avatar5.png';
}

/* ================================================================
   RENDER SIDEBAR
   ================================================================ */
function renderList() {
    const list = document.getElementById('warga-list');
    const filtered = filterWarga();

    if (filtered.length === 0) {
        list.innerHTML = `
            <div class="empty-state">
                <i class="fa-solid fa-user-slash"></i>
                <p>Tidak ada warga yang cocok</p>
            </div>`;
        return;
    }

    list.innerHTML = filtered.map(item => {
        const w = item.warga;
        const photo = getPhotoUrl(w.photo);
        return `
            <div class="warga-item" data-id="${item.id}" onclick="focusWarga('${item.id}')">
                <img class="warga-avatar" src="${photo}"
                     onerror="this.src='https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/img/avatar5.png'">
                <div class="warga-info">
                    <div class="nama">${escapeHtml(w.nama_lengkap || 'Tanpa Nama')}</div>
                    <div class="meta">
                        <span><i class="fa-solid fa-house"></i> ${escapeHtml(w.blok || '-')}</span>
                        <span>RT ${escapeHtml(w.rt || '-')}</span>
                        <span>${escapeHtml(w.tps || '-')}</span>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function filterWarga() {
    return Object.values(markers).filter(item => {
        const w = item.warga;
        if (currentFilter !== 'all' && String(w.rt) !== currentFilter) return false;
        if (currentSearch) {
            const q = currentSearch.toLowerCase();
            const hay = [w.nama_lengkap, w.blok, w.rt, w.rw, w.tps, w.no_hp]
                .map(x => String(x || '').toLowerCase()).join(' ');
            if (!hay.includes(q)) return false;
        }
        return true;
    });
}

/* ================================================================
   FILTER RT
   ================================================================ */
function buildFilters() {
    const rts = [...new Set(allWarga.map(w => String(w.rt || '').trim()).filter(Boolean))].sort();
    const row = document.getElementById('filter-row');
    row.innerHTML = `<button class="filter-chip active" data-filter="all">Semua</button>`;
    rts.forEach(rt => {
        const btn = document.createElement('button');
        btn.className = 'filter-chip';
        btn.dataset.filter = rt;
        btn.textContent = 'RT ' + rt;
        row.appendChild(btn);
    });

    row.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            row.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentFilter = chip.dataset.filter;
            renderList();
        });
    });
}

/* ================================================================
   INTERAKSI
   ================================================================ */
function focusWarga(id) {
    const item = markers[id];
    if (!item) return;

    map.flyTo({
        center: [parseFloat(item.warga.longitude), parseFloat(item.warga.latitude)],
        zoom: 19,
        pitch: 55,
        duration: 1500
    });

    Object.values(markers).forEach(m => m.popup.remove());
    item.popup.addTo(map);
    setActiveItem(id);
}

function setActiveItem(id) {
    document.querySelectorAll('.warga-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === id);
    });
    const el = document.querySelector(`.warga-item[data-id="${id}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

document.getElementById('search-input').addEventListener('input', (e) => {
    currentSearch = e.target.value.trim();
    renderList();
});

/* ================================================================
   UTIL
   ================================================================ */
function hideLoader() {
    setTimeout(() => {
        document.getElementById('loader').classList.add('hide');
    }, 400);
}

function showEmpty(msg) {
    document.getElementById('warga-list').innerHTML = `
        <div class="empty-state">
            <i class="fa-solid fa-inbox"></i>
            <p>${msg}</p>
        </div>`;
    document.getElementById('total-count').textContent = '0';
}

function laporSalahData() {
    const msg = encodeURIComponent('Halo, saya ingin melaporkan data warga yang salah di Peta Desa Segeran Kidul.');
    window.open(`https://wa.me/${ADMIN_WA}?text=${msg}`, '_blank');
}

function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
}
</script>
