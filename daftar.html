<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Warga Desa Segeran Kidul</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<style>
:root {
    --primary: #0ea5e9; --primary-dark: #0284c7;
    --success: #10b981; --dark: #0f172a;
    --gray: #64748b; --light: #f8fafc; --border: #e2e8f0;
    --shadow: 0 10px 40px rgba(0,0,0,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    min-height: 100vh; padding: 20px;
    display: flex; align-items: flex-start; justify-content: center;
}
.container-form {
    width: 100%; max-width: 520px; background: #fff;
    border-radius: 24px; box-shadow: var(--shadow); overflow: hidden;
}
.form-header {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    padding: 30px; color: #fff; text-align: center;
}
.form-header .icon-box {
    width: 60px; height: 60px; background: rgba(255,255,255,.2);
    border-radius: 16px; display: inline-flex; align-items: center;
    justify-content: center; font-size: 28px; margin-bottom: 12px;
}
.form-header h1 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
.form-header p { font-size: 13px; opacity: .9; }

.form-body { padding: 28px; }

.form-group { margin-bottom: 18px; }
.form-label {
    display: block; font-size: 12px; font-weight: 700;
    color: var(--dark); margin-bottom: 6px; text-transform: uppercase;
    letter-spacing: .5px;
}
.form-label .required { color: #ef4444; }
.form-input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-family: inherit; font-size: 14px; color: var(--dark);
    transition: all .2s ease; background: #fff;
}
.form-input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(14,165,233,.1);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

.foto-upload {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 24px; text-align: center; cursor: pointer;
    transition: all .2s ease; background: var(--light);
}
.foto-upload:hover { border-color: var(--primary); background: #f0f9ff; }
.foto-upload i { font-size: 32px; color: var(--primary); margin-bottom: 8px; display: block; }
.foto-upload p { font-size: 13px; color: var(--gray); font-weight: 600; }
.foto-upload small { font-size: 10px; color: var(--gray); opacity: .7; }
#preview {
    width: 100%; max-height: 240px; object-fit: cover;
    border-radius: 12px; display: none; margin-top: 10px;
}

.mini-map-wrap {
    position: relative; border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 0 1.5px var(--border);
}
#mini-map { height: 240px; width: 100%; }
.map-hint {
    position: absolute; top: 10px; left: 10px; right: 10px;
    background: rgba(255,255,255,.95); backdrop-filter: blur(10px);
    padding: 8px 12px; border-radius: 8px; font-size: 11px;
    font-weight: 600; color: var(--dark); box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 6px;
}
.btn-gps {
    width: 100%; padding: 10px; margin-top: 8px;
    background: var(--light); border: 1.5px solid var(--border);
    border-radius: 10px; font-family: inherit; font-weight: 700;
    font-size: 13px; cursor: pointer; transition: all .2s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-gps:hover { border-color: var(--primary); color: var(--primary); }

.btn-submit {
    width: 100%; padding: 16px; margin-top: 20px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border: none; border-radius: 12px; color: #fff;
    font-family: inherit; font-weight: 800; font-size: 15px;
    cursor: pointer; transition: all .2s ease;
    box-shadow: 0 4px 16px rgba(14,165,233,.4);
}
.btn-submit:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(14,165,233,.5);
}
.btn-submit:disabled { opacity: .6; cursor: not-allowed; }

#msg { margin-top: 16px; }
.alert {
    padding: 14px 16px; border-radius: 10px;
    font-size: 13px; font-weight: 600;
}
.alert-success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
.alert-danger  { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
.alert-warning { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
.alert-info    { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }

/* Progress bar upload */
.upload-progress {
    height: 4px; background: var(--border); border-radius: 2px;
    overflow: hidden; margin-top: 8px; display: none;
}
.upload-progress.show { display: block; }
.upload-progress .bar {
    height: 100%; background: var(--primary); width: 0%;
    transition: width .3s ease;
}
</style>
</head>
<body>

<div class="container-form">
    <div class="form-header">
        <div class="icon-box"><i class="fa-solid fa-user-plus"></i></div>
        <h1>Pendaftaran Warga</h1>
        <p>Desa Segeran Kidul</p>
    </div>

    <div class="form-body">
        <form id="form-warga" novalidate>

            <div class="form-group">
                <label class="form-label">Nama Lengkap <span class="required">*</span></label>
                <input type="text" class="form-input" name="nama_lengkap" required placeholder="Contoh: FATIMATUZ ZAHRA">
            </div>

            <div class="form-row-3">
                <div class="form-group">
                    <label class="form-label">Blok <span class="required">*</span></label>
                    <input type="text" class="form-input" name="blok" required placeholder="BLOK">
                </div>
                <div class="form-group">
                    <label class="form-label">RT <span class="required">*</span></label>
                    <input type="text" class="form-input" name="rt" required placeholder="001">
                </div>
                <div class="form-group">
                    <label class="form-label">RW <span class="required">*</span></label>
                    <input type="text" class="form-input" name="rw" required placeholder="002">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">NO RUMAH <span class="required">*</span></label>
                    <input type="text" class="form-input" name="tps" required placeholder="037">
                </div>
                <div class="form-group">
                    <label class="form-label">No HP <span class="required">*</span></label>
                    <input type="tel" class="form-input" name="no_hp" required placeholder="08xxxxxxxxxx">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Foto Diri</label>
                <div class="foto-upload" onclick="document.getElementById('foto-input').click()">
                    <i class="fa-solid fa-camera"></i>
                    <p>Klik untuk pilih foto</p>
                    <small>Maks 2MB · JPG/PNG</small>
                </div>
                <input type="file" id="foto-input" accept="image/*" style="display:none">
                <img id="preview">
            </div>

            <div class="form-group">
                <label class="form-label">Lokasi Rumah <span class="required">*</span></label>
                <div class="mini-map-wrap">
                    <div id="mini-map"></div>
                    <div class="map-hint">
                        <i class="fa-solid fa-hand-pointer"></i>
                        <span>Klik peta atau gunakan GPS</span>
                    </div>
                </div>
                <button type="button" class="btn-gps" onclick="ambilLokasi()">
                    <i class="fa-solid fa-crosshairs"></i> Gunakan Lokasi Saat Ini
                </button>
                <input type="hidden" name="latitude" id="inp-lat">
                <input type="hidden" name="longitude" id="inp-lng">
                <div id="coord-display" style="font-size:11px; color:var(--gray); margin-top:6px; text-align:center; font-weight:600;"></div>
            </div>

            <button type="submit" class="btn-submit" id="btn-submit">
                <i class="fa-solid fa-paper-plane"></i> Kirim Pendaftaran
            </button>

            <div class="upload-progress" id="progress">
                <div class="bar" id="progress-bar"></div>
            </div>
        </form>

        <div id="msg"></div>
    </div>
</div>

<script>
/* =========================================================
   GANTI DENGAN URL WEB APP ANDA (yang berakhiran /exec)
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbxLACfkiDvxp5ljiHK-cHIzJw7glGAKqP3w2oXF33CvKBJMjmId2bH35rmz8Eti1s3nXA/exec";

/* ============================
   MINI MAP
   ============================ */
const miniMap = new maplibregl.Map({
    container: 'mini-map',
    style: {
        version: 8,
        sources: {
            'sat': {
                type: 'raster',
                tiles: ['https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'],
                tileSize: 256
            }
        },
        layers: [{ id: 'sat', type: 'raster', source: 'sat' }]
    },
    center: [108.3958, -6.4682],
    zoom: 16,
    pitch: 45
});

let pickedMarker = null;

miniMap.on('click', (e) => {
    setLokasi(e.lngLat.lat, e.lngLat.lng);
});

function setLokasi(lat, lng) {
    document.getElementById('inp-lat').value = lat.toFixed(8);
    document.getElementById('inp-lng').value = lng.toFixed(8);
    document.getElementById('coord-display').textContent =
        `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    if (pickedMarker) pickedMarker.remove();
    pickedMarker = new maplibregl.Marker({ color: '#ef4444' })
        .setLngLat([lng, lat]).addTo(miniMap);
}

function ambilLokasi() {
    if (!navigator.geolocation) return alert('Browser tidak mendukung GPS');
    navigator.geolocation.getCurrentPosition(
        pos => {
            setLokasi(pos.coords.latitude, pos.coords.longitude);
            miniMap.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 18 });
        },
        err => alert('Gagal ambil lokasi: ' + err.message),
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

/* ============================
   FOTO → KOMPRES → BASE64
   ============================ */
let base64Foto = '';
let namaFoto = '';

document.getElementById('foto-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    if (file.size > 5 * 1024 * 1024) {
        alert('Ukuran foto maksimal 5MB');
        e.target.value = '';
        return;
    }

    namaFoto = file.name.replace(/\s+/g, '_');

    // Kompres foto via canvas agar base64 tidak terlalu besar
    const reader = new FileReader();
    reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
            const MAX = 800; // px
            let w = img.width, h = img.height;
            if (w > h && w > MAX) { h = h * MAX / w; w = MAX; }
            else if (h > MAX)       { w = w * MAX / h; h = MAX; }

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            // JPEG quality 0.75
            base64Foto = canvas.toDataURL('image/jpeg', 0.75);

            const prev = document.getElementById('preview');
            prev.src = base64Foto;
            prev.style.display = 'block';

            // Estimasi ukuran
            const sizeKB = Math.round((base64Foto.length * 3 / 4) / 1024);
            console.log('[FOTO] Ukuran setelah kompres:', sizeKB, 'KB');
            if (sizeKB > 2000) {
                alert('Foto masih terlalu besar (' + sizeKB + 'KB). Coba foto lain.');
                base64Foto = '';
                prev.style.display = 'none';
            }
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
});

/* ============================
   SUBMIT — KIRIM SEBAGAI JSON
   ============================ */
document.getElementById('form-warga').addEventListener('submit', async (e) => {
    e.preventDefault();

    const btn     = document.getElementById('btn-submit');
    const msg     = document.getElementById('msg');
    const prog    = document.getElementById('progress');
    const progBar = document.getElementById('progress-bar');

    msg.innerHTML = '';

    // ---- Validasi form manual (karena novalidate) ----
    const formEl = e.target;
    if (!formEl.checkValidity()) {
        const first = formEl.querySelector(':invalid');
        if (first) {
            first.focus();
            first.style.borderColor = '#ef4444';
            setTimeout(() => first.style.borderColor = '', 2000);
        }
        msg.innerHTML = '<div class="alert alert-warning">⚠️ Lengkapi semua field wajib (*)</div>';
        return;
    }

    const lat = document.getElementById('inp-lat').value;
    const lng = document.getElementById('inp-lng').value;
    if (!lat || !lng) {
        msg.innerHTML = '<div class="alert alert-warning">⚠️ Silakan pilih lokasi di peta terlebih dahulu.</div>';
        return;
    }

    // ---- Siapkan payload JSON ----
    const payload = {
        action: 'create',
        nama_lengkap: formEl.nama_lengkap.value.trim(),
        blok:         formEl.blok.value.trim(),
        rt:           formEl.rt.value.trim(),
        rw:           formEl.rw.value.trim(),
        tps:          formEl.tps.value.trim(),
        no_hp:        formEl.no_hp.value.trim(),
        latitude:     parseFloat(lat),
        longitude:    parseFloat(lng),
        photo_base64: base64Foto || '',
        photo_name:   namaFoto || ''
    };

    console.log('[SUBMIT] Payload:', {
        ...payload,
        photo_base64: payload.photo_base64 ? '[' + Math.round(payload.photo_base64.length/1024) + ' KB]' : '(kosong)'
    });

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim...';
    prog.classList.add('show');
    progBar.style.width = '30%';

    try {
        // ---- Kirim via fetch ----
        // text/plain menghindari CORS preflight ke Apps Script
        const res = await fetch(API_URL, {
            method: 'POST',
            mode: 'cors',
            redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        });

        progBar.style.width = '80%';

        if (!res.ok) throw new Error('HTTP ' + res.status);

        const text = await res.text();
        console.log('[RESPONSE RAW]', text);

        let data;
        try {
            data = JSON.parse(text);
        } catch (parseErr) {
            console.error('Response bukan JSON:', text.substring(0, 500));
            throw new Error('Response bukan JSON. Cek deploy Apps Script (harus "Anyone").');
        }

        progBar.style.width = '100%';

        if (data.status === 'success') {
            msg.innerHTML = '<div class="alert alert-success">✅ Data berhasil dikirim! Terima kasih.</div>';
            formEl.reset();
            document.getElementById('preview').style.display = 'none';
            document.getElementById('coord-display').textContent = '';
            base64Foto = '';
            namaFoto = '';
            if (pickedMarker) { pickedMarker.remove(); pickedMarker = null; }
        } else {
            msg.innerHTML = '<div class="alert alert-danger">❌ ' + (data.message || 'Gagal menyimpan') + '</div>';
        }
    } catch (err) {
        console.error('[ERROR]', err);
        msg.innerHTML = '<div class="alert alert-danger">❌ ' + err.message +
            '<br><small>Cek Console (F12) untuk detail.</small></div>';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Pendaftaran';
        setTimeout(() => {
            prog.classList.remove('show');
            progBar.style.width = '0%';
        }, 800);
    }
});
</script>

</body>
</html>
