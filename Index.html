<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Warga Desa Segeran Kidul</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family:'Segoe UI',Tahoma,sans-serif; }
        #map-canvas { height: 100vh; width: 100%; }

        /* Popup Profil */
        .custom-popup { width: 210px; text-align: center; padding: 5px; }
        .popup-photo img {
            width: 100%; height: 180px; object-fit: cover;
            border-radius: 12px; border: 3px solid #009cdc;
            margin-bottom: 8px; background-color: #f8f9fa;
        }
        .popup-info { font-size: 11px; color: #495057; text-align: left; margin-top: 6px; line-height: 1.5; }
        .popup-info i { width: 14px; color: #009cdc; }
        .popup-lokasi { font-size: 11px; color: #6c757d; }

        .instruction-3d {
            position: absolute; bottom: 20px; right: 20px; z-index: 1000;
            background: rgba(0,0,0,.75); color: #fff; padding: 10px 15px;
            border-radius: 30px; font-size: 12px; pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,.3);
        }
        .legend-box {
            position: absolute; bottom: 20px; left: 20px; z-index: 1000;
            background: rgba(255,255,255,.92); padding: 10px 14px;
            border-radius: 12px; font-size: 12px; box-shadow: 0 4px 15px rgba(0,0,0,.15);
            backdrop-filter: blur(5px);
        }
        .legend-box .dot { width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px; }
        #search-input {
            position:absolute; top:70px; right:80px; z-index:1000;
            width:220px; border-radius:20px; border:1px solid #ccc; padding:8px 14px;
            font-size:13px; box-shadow:0 4px 15px rgba(0,0,0,.1);
        }
    </style>
</head>
<body>

<section class="page" id="list-page-mahasiswa">
    <div class="container-fluid p-0" style="position: relative;">
        <div id="map-canvas"></div>

        <!-- Judul -->
        <div class="map-header-no-card" style="position:absolute; top:15px; left:20px; right:20px; z-index:1000;">
            <h6 class="m-0 font-weight-bold" style="color:#2d3436; text-shadow:1px 1px 4px white; font-size:1.1rem;">
                <i class="fa fa-map-marked-alt mr-2" style="color:#009cdc;"></i>
                Peta Warga Blok Bedug Desa Segeran Kidul
            </h6>
        </div>

        <!-- Tombol Aksi -->
        <div class="map-overlay-top-left"
             style="position:absolute; top:70px; left:20px; z-index:1000;
                    background:rgba(255,255,255,.85); padding:12px; border-radius:20px;
                    backdrop-filter:blur(5px); box-shadow:0 4px 15px rgba(0,0,0,.1); width:160px;">
            <a class="btn btn-outline-danger btn-sm btn-block rounded-pill shadow-sm font-weight-bold mb-2"
               href="https://wa.me/628179402420" target="_blank">
                <i class="fa fa-info-circle mr-1"></i> Salah Data?
            </a>
            <a class="btn btn-success btn-sm btn-block rounded-pill shadow-sm font-weight-bold"
               href="URL_WEB_APP_ANDA" target="_blank">
                <i class="fa fa-file-signature mr-1"></i> Daftar Baru
            </a>
        </div>

        <!-- Pencarian -->
        <input id="search-input" type="text" placeholder="🔍 Cari nama / blok / RT..." />

        <!-- Legenda -->
        <div class="legend-box">
            <div><span class="dot" style="background:#009cdc;"></span> Warga Terdaftar</div>
            <div class="mt-1"><strong id="total-warga">0</strong> titik data</div>
        </div>

        <div class="instruction-3d">
            <i class="fa fa-compass mr-1"></i> Tahan <strong>Klik Kanan + Geser</strong> untuk rotasi 3D
        </div>
    </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {

    // ==== GANTI DENGAN URL WEB APP APPS SCRIPT ANDA ====
    const API_URL = "https://script.google.com/macros/s/AKfycbxLACfkiDvxp5ljiHK-cHIzJw7glGAKqP3w2oXF33CvKBJMjmId2bH35rmz8Eti1s3nXA/exec?action=read";

    const map = new maplibregl.Map({
        container: 'map-canvas',
        style: {
            version: 8,
            sources: {
                'satelit-google': {
                    type: 'raster',
                    tiles: ['https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'],
                    tileSize: 256,
                    attribution: '© Google Maps Satellite'
                }
            },
            layers: [{
                id: 'satelit-layer',
                type: 'raster',
                source: 'satelit-google',
                minzoom: 0,
                maxzoom: 24
            }]
        },
        center: [108.3958, -6.4682],
        zoom: 16,
        maxZoom: 23,
        pitch: 60,
        bearing: -10,
        antialias: true
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-right');
    map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: true }), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

    // Simpan semua marker agar bisa difilter
    let allMarkers = [];

    map.on('load', function () {
        fetch(API_URL)
            .then(r => r.json())
            .then(records => {
                const bounds = new maplibregl.LngLatBounds();
                let hasValidData = false;

                records.forEach(function (data) {
                    const lat = parseFloat(data.latitude);
                    const lng = parseFloat(data.longitude);
                    if (isNaN(lat) || isNaN(lng)) return;
                    if (!(lat < -5.5 && lat > -8.0 && lng > 105.0 && lng < 109.5)) return;

                    // ==== FOTO ====
                    const avatarDefault = "https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/img/avatar5.png";
                    let imgSrc = avatarDefault;
                    const urlFoto = data.photo || "";
                    if (urlFoto && urlFoto.includes("drive.google.com")) {
                        let fileId = "";
                        if (urlFoto.includes("id="))       fileId = urlFoto.split("id=")[1].split("&")[0];
                        else if (urlFoto.includes("/file/d/")) fileId = urlFoto.split("/file/d/")[1].split("/")[0];
                        else if (urlFoto.includes("/d/"))   fileId = urlFoto.split("/d/")[1].split("/")[0];
                        if (fileId) imgSrc = "https://lh3.googleusercontent.com/d/" + fileId;
                    } else if (urlFoto && urlFoto.startsWith("http")) {
                        imgSrc = urlFoto;
                    }

                    // ==== POPUP ====
                    const content = `
                        <div class="custom-popup">
                            <div class="popup-photo">
                                <img src="${imgSrc}" onerror="this.onerror=null;this.src='${avatarDefault}';">
                            </div>
                            <h6 class="mb-1 font-weight-bold" style="color:#2c3e50;font-size:14px;">
                                ${data.nama_lengkap || '-'}
                            </h6>
                            <p class="popup-lokasi mb-1">
                                <i class="fa fa-map-marker-alt text-danger mr-1"></i>
                                Blok ${data.blok || '-'}
                            </p>
                            <div class="popup-info">
                                <div><i class="fa fa-users"></i> RT ${data.rt || '-'} / RW ${data.rw || '-'}</div>
                                <div><i class="fa fa-vote-yea"></i> TPS ${data.tps || '-'}</div>
                                <div><i class="fa fa-phone"></i> ${data.no_hp || '-'}</div>
                            </div>
                        </div>`;

                    const popup = new maplibregl.Popup({ offset: 25, closeButton: true })
                        .setHTML(content);

                    const marker = new maplibregl.Marker({ color: '#009cdc' })
                        .setLngLat([lng, lat])
                        .setPopup(popup)
                        .addTo(map);

                    // Simpan metadata untuk pencarian
                    marker._meta = {
                        nama: (data.nama_lengkap || '').toLowerCase(),
                        blok: (data.blok || '').toLowerCase(),
                        rt:   (data.rt || '').toLowerCase(),
                        rw:   (data.rw || '').toLowerCase(),
                        lng, lat
                    };
                    allMarkers.push(marker);

                    bounds.extend([lng, lat]);
                    hasValidData = true;
                });

                document.getElementById('total-warga').textContent = allMarkers.length;

                if (hasValidData) {
                    map.fitBounds(bounds, { padding: 80, maxZoom: 18 });
                }
            })
            .catch(err => console.error('Gagal ambil data:', err));
    });

    // ==== FITUR PENCARIAN ====
    document.getElementById('search-input').addEventListener('input', function (e) {
        const q = e.target.value.toLowerCase().trim();
        allMarkers.forEach(m => {
            const meta = m._meta;
            const cocok = !q
                || meta.nama.includes(q)
                || meta.blok.includes(q)
                || meta.rt.includes(q)
                || meta.rw.includes(q);
            m.getElement().style.display = cocok ? '' : 'none';
        });
    });
});
</script>

</body>
</html>
